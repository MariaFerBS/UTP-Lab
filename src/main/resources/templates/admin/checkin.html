<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('UTP +Lab - Check-in (Admin)')}"></head>
<body>
  <div class="contenedor-app">
    
    <aside th:replace="~{fragments/sidebar-admin :: sidebar('checkin')}"></aside>

    <main class="area-principal">
      <header th:replace="~{fragments/topbar-admin :: topbar}"></header>

      <section class="seccion-checkout">
        
        <div class="fila-dashboard-header" style="margin-bottom: 1rem;">
            <div>
                <h1 class="titulo-seccion-catalogo">Supervisión de Check-in</h1>
                <p class="subtitulo-seccion-catalogo">Visualización del estado de asistencia (Acción exclusiva del Encargado)</p>
            </div>
            
            <div class="selector-fecha-dashboard">
                <a th:href="@{/admin/checkin(fecha=${fechaAnterior})}" class="btn-fecha-nav" title="Día anterior">
                    <i data-lucide="chevron-left"></i>
                </a>
                <input type="date" 
                       th:value="${fechaConsulta}"
                       onchange="window.location.href='/admin/checkin?fecha=' + this.value"
                       class="input-fecha-dashboard">
                <a th:href="@{/admin/checkin(fecha=${fechaSiguiente})}" class="btn-fecha-nav" title="Día siguiente">
                    <i data-lucide="chevron-right"></i>
                </a>
            </div>
        </div>

        <!-- LISTADO DE RESERVAS -->
        <div id="contenedorListaCheckin" 
             class="lista-tarjetas-checkin" 
             th:style="${#lists.isEmpty(reservas)} ? 'display:none;' : 'display:flex;'">
          
          <div th:each="r : ${reservas}" 
               class="tarjeta-reserva-checkin-fila" 
               th:id="'tarjeta-reserva-' + ${r.idReserva}">
            
            <div class="icono-cuadro-checkin" th:classappend="${#strings.containsIgnoreCase(r.laboratorio, 'Física') ? 'bg-rayo' : 'bg-quimica'}">
              <span th:if="${#strings.containsIgnoreCase(r.laboratorio, 'Física')}">⚡</span>
              <span th:unless="${#strings.containsIgnoreCase(r.laboratorio, 'Física')}">⚗️</span>
            </div>

            <div class="info-central-checkin">
              <div class="fila-nombre-estado">
                <strong class="nombre-lab-checkin" th:text="${r.laboratorio}">Lab. Química</strong>
                <span class="badge-estado-pill" 
                      th:classappend="${r.estado == 'CONFIRMADA' ? 'estado-confirmada' : 
                                      (r.estado == 'EN_USO' ? 'estado-en-uso' : 
                                      (r.estado == 'DEVUELTA' ? 'estado-devuelta' : 
                                      (r.estado == 'INSPECCIONADA' ? 'estado-inspeccionada' : 
                                      (r.estado == 'CON_INCIDENCIA' ? 'estado-incidencia' : 
                                      (r.estado == 'NO_ASISTIO' ? 'estado-no-asistio' : 
                                      (r.estado == 'NO_INSPECCIONADO' ? 'estado-no-inspeccionado' : 'estado-pendiente'))))))}"
                      th:text="${r.estado == 'CONFIRMADA' ? 'Pendiente de Check-in' : 
                               (r.estado == 'EN_USO' ? 'Check-in Realizado' : 
                               (r.estado == 'DEVUELTA' ? 'Devuelta' : 
                               (r.estado == 'INSPECCIONADA' ? 'Inspeccionada' : 
                               (r.estado == 'CON_INCIDENCIA' ? 'Con Incidencia' : 
                               (r.estado == 'NO_ASISTIO' ? 'No Asistió' : 
                               (r.estado == 'NO_INSPECCIONADO' ? 'No Inspeccionado' : 'Pendiente'))))))}">
                  Estado
                </span>
              </div>
              
              <div class="metadatos-horario-checkin">
                <span th:text="${r.cubiculo + ' · ' + r.fecha + ' · ' + r.horario}">A-101 · 2026-08-21 · 09:00–11:00</span>
              </div>
              
              <div class="pills-integrantes-flex">
                <span th:each="integ : ${r.integrantes}" class="pill-integrante-nombre" th:text="${integ}">
                  Mariafernanda Bruno Santos
                </span>
              </div>
            </div>

            <div class="accion-derecha-checkin">
              <span class="codigo-reserva-checkin" th:text="${r.idReserva}">R-001</span>
              
              <!-- El Admin SOLO VE ESTADO, NO TIENE BOTÓN DE ACCIÓN -->
              <div th:if="${r.estado == 'CONFIRMADA'}" style="font-size: 13px; color: #64748b; font-weight: 600; text-align: right;">
                <i data-lucide="clock" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle;"></i> 
                Esperando validación
              </div>
              
              <div th:if="${r.estado == 'EN_USO' or r.estado == 'DEVUELTA' or r.estado == 'INSPECCIONADA' or r.estado == 'CON_INCIDENCIA' or r.estado == 'NO_ASISTIO'}" 
                   style="font-size: 13px; color: #10b981; font-weight: 600; text-align: right;">
                <i data-lucide="check-circle" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle;"></i> 
                Validado por Encargado
              </div>
            </div>

          </div>
        </div>

        <!-- 2. ESTADO VACÍO -->
        <div id="tarjetaSinCheckins" 
             class="tarjeta-sin-checkins-vacia" 
             th:style="${#lists.isEmpty(reservas)} ? 'display:flex;' : 'display:none;'">
          <span class="icono-fiesta-confeti">🎉</span>
          <strong>Sin reservas registradas para esta fecha</strong>
        </div>

      </section>
    </main>
  </div>

  <div th:replace="~{fragments/scripts}"></div>    
</body>
</html>
