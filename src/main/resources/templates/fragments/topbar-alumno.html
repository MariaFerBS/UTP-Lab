
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- TOPBAR DEL ALUMNO -->
<header th:fragment="topbarAlumno" class="cabecera-superior">

    <!-- BOTÓN HAMBURGUESA -->
    <button
        type="button"
        class="btn-hamburguesa"
        onclick="toggleSidebar()"
        aria-label="Abrir menú"
    >
        <i data-lucide="menu"></i>
    </button>

    <!-- LOGO -->
    <div class="logo-cabecera">
        <span class="insignia-utp">UTP</span>
        <span class="texto-lab">+Lab</span>
    </div>

    <!-- ACCIONES DEL PERFIL -->
    <div class="perfil-acciones">

        <!-- CAMPANITA -->
        <div class="contenedor-campana-wrapper">

            <button
                type="button"
                class="boton-campana-amarilla"
                onclick="toggleNotificaciones(event)"
                aria-label="Ver notificaciones"
                aria-expanded="false"
            >
                <i data-lucide="bell"></i>

                <span
                    class="badge-campana"
                    th:if="${numIncidencias != null and numIncidencias > 0}"
                    th:text="${numIncidencias}"
                >1</span>
            </button>

            <!-- PANEL DE NOTIFICACIONES -->
            <div
                id="burbujaNotificaciones"
                class="burbuja-notificaciones"
                hidden
            >

                <div class="cabecera-burbuja">
                    <strong>Notificaciones</strong>

                    <button
                        type="button"
                        class="btn-cerrar-burbuja"
                        onclick="cerrarNotificaciones()"
                        aria-label="Cerrar notificaciones"
                    >
                        ✕
                    </button>
                </div>

                <!-- AQUÍ SE CARGAN LAS NOTIFICACIONES -->
                <div
                    id="listaNotificaciones"
                    class="lista-notificaciones"
                >
                    <div class="estado-notificaciones">
                        <span class="spinner-notificaciones"></span>
                        <p>Cargando notificaciones...</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- DATOS DEL ALUMNO -->
        <div class="datos-perfil">
            <span
                class="titulo-saludo"
                th:text="'Hola, ' + ${alumno.nombre}"
            >Hola, estudiante</span>

            <span class="subtitulo-rol">Estudiante</span>
        </div>

        <!-- AVATAR -->
        <div
            class="circulo-avatar avatar-azul"
            th:text="${#strings.isEmpty(alumno.nombre) ? '?' : #strings.substring(alumno.nombre,0,1)} + ${#strings.isEmpty(alumno.apellido) ? '' : #strings.substring(alumno.apellido,0,1)}"
        >MB</div>

        <!-- SALIR -->
        <a th:href="@{/logout}" class="enlace-salir">
            <i data-lucide="log-out"></i>
            <span>Salir</span>
        </a>

    </div>
</header>


<!-- SCRIPTS DEL TOPBAR -->
<th:block th:fragment="scriptsAlumno">
    <script th:src="@{/js/topbar-alumno.js}"></script>
</th:block>

</body>
</html>
