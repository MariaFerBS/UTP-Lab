<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ========================================================= -->
<!-- SCRIPTS GLOBALES                                          -->
<!-- ========================================================= -->
<th:block th:fragment="scriptsAlumno">
    <!-- Carga de Lucide si no fue cargado previamente -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/topbar-alumno.js}"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Renderiza los iconos de Lucide (incluyendo el boton de hamburguesa)
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-abierto');
            
            let overlay = document.querySelector('.sidebar-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'sidebar-overlay';
                // Cerrar al hacer clic sobre el fondo oscuro
                overlay.addEventListener('click', function () {
                    document.body.classList.remove('sidebar-abierto');
                });
                document.body.appendChild(overlay);
            }
        }

        // Forzar cierre si la ventana se expande a escritorio
        window.addEventListener('resize', function () {
            if (window.innerWidth > 1024) {
                document.body.classList.remove('sidebar-abierto');
            }
        });
    </script>
</th:block>

</body>
</html>
