<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ========================================================= -->
<!-- SCRIPTS GLOBALES                                          -->
<!-- ========================================================= -->
<th:block th:fragment="scripts">
    <!-- Librería de íconos (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Inicializar los íconos en todas las páginas -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        function toggleSidebar() {
    // Abre o cierra el menú
    document.body.classList.toggle('sidebar-abierto');
    
    // Crea el fondo oscuro si no existe
    let overlay = document.querySelector('.sidebar-overlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'sidebar-overlay';
        overlay.onclick = toggleSidebar; // Cierra al hacer clic fuera
        document.body.appendChild(overlay);
    }
}

// Cerrar el menú si el usuario cambia el tamaño de la ventana a escritorio
window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.body.classList.remove('sidebar-abierto');
    }
});
    </script>

</th:block>

</body>
</html>
